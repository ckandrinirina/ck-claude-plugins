name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  # Weekly refresh so changelog updates in the plugin repos appear on the site
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; newer pushes cancel queued runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for the sitemap's lastmod dates

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          # The changelog page is sourced from each plugin's own CHANGELOG.md
          # (each plugin lives in its own repo, so fetch them at build time)
          curl -fsSL https://raw.githubusercontent.com/ckandrinirina/ck-code/main/CHANGELOG.md      -o _site/ck-code-changelog.md
          curl -fsSL https://raw.githubusercontent.com/ckandrinirina/ck-code-lite/main/CHANGELOG.md -o _site/ck-code-lite-changelog.md
          curl -fsSL https://raw.githubusercontent.com/ckandrinirina/ck-tools/main/CHANGELOG.md     -o _site/ck-tools-changelog.md
          # Each sitemap <lastmod> is the page's last commit; the changelog page is rebuilt
          # from the plugin repos on every deploy, so it takes today's date
          today=$(date -u +%F)
          awk -v today="$today" '
            /<loc>/ { f = $0; sub(/.*ck-claude-plugins\//, "", f); sub(/<\/loc>.*/, "", f); if (f == "") f = "index.html" }
            /<lastmod>/ {
              d = today
              if (f != "changelog.html") { cmd = "git log -1 --format=%cs -- site/" f; cmd | getline d; close(cmd); if (d == "") d = today }
              sub(/<lastmod>[^<]*<\/lastmod>/, "<lastmod>" d "</lastmod>")
            }
            { print }' site/sitemap.xml > _site/sitemap.xml
          # GitHub Pages skips files/dirs starting with "_" unless this exists
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
